<!DOCTYPE html>
<html>
<head>
<meta charset="utf8">
<title>TesTube</title>
<style>
* {
  margin: 0;
  padding: 0;
}
body {
  background: #000000;
  color: #ffffff;
  font: 16px sans serif;
  height: 100vh;
  overflow: hidden;
}
.bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: #111111;
  padding: 8px 12px;
  display: flex;
}
.bar input {
  flex: 1;
  height: 40px;
  background: #222222;
  color: #ffffff;
  border: 1px solid #444444;
  padding: 0 12px;
  font: 16px sans serif;
  outline: none;
}
.bar button {
  height: 40px;
  background: #cc0000;
  color: #ffffff;
  border: none;
  padding: 0 20px;
  font: bold 14px sans serif;
  cursor: pointer;
  margin: 0 0 0 8px;
}
.presets {
  position: absolute;
  top: 56px;
  left: 0;
  right: 0;
  height: 44px;
  background: #1a1a1a;
  padding: 4px 12px;
  display: flex;
}
.presets button {
  height: 36px;
  background: #333333;
  color: #ffffff;
  border: none;
  padding: 0 14px;
  font: 14px sans serif;
  cursor: pointer;
  margin: 0 8px 0 0;
}
.viewer {
  position: absolute;
  top: 100px;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  border: none;
}
</style>
</head>
<body>

<div class="bar">
  <input id="link" type="text" placeholder="Paste YouTube link or video ID">
  <button onclick="playUrl()">Play</button>
</div>

<div class="presets">
  <button onclick="swap('jfKfPfyJRdk')">Lofi Live</button>
  <button onclick="swap('30jF2vtVlKQ')">NTR Hits</button>
  <button onclick="swap('N6YIFWfqBfo')">Melodies</button>
</div>

<iframe id="frame" class="viewer" src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1" allow="autoplay"></iframe>

<script>
function grabId(val) {
  let text = val.trim();
  if (text.includes("watch?v=")) {
    return text.split("watch?v=")[1].split("&")[0];
  }
  if (text.includes("youtu.be/")) {
    return text.split("youtu.be/")[1].split("?")[0];
  }
  if (text.includes("embed/")) {
    return text.split("embed/")[1].split("?")[0];
  }
  return text;
}

function playUrl() {
  let val = document.getElementById("link").value;
  let id = grabId(val);
  if (id) {
    swap(id);
  }
}

function swap(id) {
  let player = document.getElementById("frame");
  player.src = "https://www.youtube.com/embed/" + id + "?autoplay=1";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf8">
<title>TesTube</title>
<style>
* {
  margin: 0;
  padding: 0;
}
body {
  background: #000000;
  color: #ffffff;
  font: 16px sans-serif;
  height: 100vh;
  overflow: hidden;
}
.header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: #111111;
  padding: 8px 12px;
  display: flex;
  gap: 8px;
}
.queryInput {
  flex: 1;
  height: 40px;
  background: #222222;
  color: #ffffff;
  border: 1px solid #444444;
  padding: 0 12px;
  font: 16px sans-serif;
  outline: none;
}
.actionBtn {
  height: 40px;
  background: #0066cc;
  color: #ffffff;
  border: none;
  padding: 0 18px;
  font: bold 14px sans-serif;
  cursor: pointer;
}
.presetBar {
  position: absolute;
  top: 56px;
  left: 0;
  right: 0;
  height: 46px;
  background: #1a1a1a;
  padding: 5px 12px;
  display: flex;
  gap: 8px;
  overflow: auto;
}
.presetBtn {
  height: 36px;
  background: #2e2e2e;
  color: #ffffff;
  border: none;
  padding: 0 14px;
  font: 13px sans-serif;
  cursor: pointer;
}
.screenArea {
  position: absolute;
  top: 102px;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  border: none;
}
</style>
</head>
<body>

<div class="header">
  <input id="queryInput" class="queryInput" type="text" placeholder="Type keywords or paste YouTube link">
  <button class="actionBtn" onclick="handleSearch()">Search</button>
</div>

<div class="presetBar">
  <button class="presetBtn" onclick="loadVideo('cjh8JK_6JDY')">Telugu Hits</button>
  <button class="presetBtn" onclick="loadVideo('N6YIFWfqBfo')">Telugu Melodies</button>
  <button class="presetBtn" onclick="loadVideo('30jF2vtVlKQ')">NTR Hits</button>
  <button class="presetBtn" onclick="loadVideo('jfKfPfyJRdk')">Lofi Beats</button>
</div>

<iframe id="mainPlayer" class="screenArea" src="https://www.youtube.com/embed/cjh8JK_6JDY?autoplay=1" allow="autoplay; fullscreen"></iframe>

<script>
function extractId(text) {
  let raw = text.trim();
  if (raw.includes("watch?v=")) {
    return raw.split("watch?v=")[1].split("&")[0];
  }
  if (raw.includes("youtu.be/")) {
    return raw.split("youtu.be/")[1].split("?")[0];
  }
  if (raw.includes("embed/")) {
    return raw.split("embed/")[1].split("?")[0];
  }
  if (raw.length == 11) {
    return raw;
  }
  return null;
}

function handleSearch() {
  let box = document.getElementById("queryInput");
  let query = box.value.trim();
  if (!query) {
    return;
  }

  let id = extractId(query);
  if (id) {
    loadVideo(id);
    return;
  }

  let lower = query.toLowerCase();
  if (lower.includes("melody") || lower.includes("old")) {
    loadVideo("N6YIFWfqBfo");
  } else if (lower.includes("ntr")) {
    loadVideo("30jF2vtVlKQ");
  } else if (lower.includes("lofi")) {
    loadVideo("jfKfPfyJRdk");
  } else {
    loadVideo("cjh8JK_6JDY");
  }
}

function loadVideo(id) {
  let player = document.getElementById("mainPlayer");
  player.src = "https://www.youtube.com/embed/" + id + "?autoplay=1";
}
</script>

</body>
</html>
